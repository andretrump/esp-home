[package]
name = "plant-tower-rs"
version = "0.1.0"
authors = ["andretrump <mail@atrump.de>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "plant-tower-rs"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = [
  "critical-section",
  "embassy-time-driver",
  "embassy-sync",
] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
esp-idf-hal = "0.46.2"
embedded-svc = "0.29.0"
anyhow = "1.0.103"
json = "0.12.4"
strum_macros = "0.28.0"
urlencoding = "2.1.3"
thiserror = "2.0.20"

[build-dependencies]
embuild = "0.33"
minify-html = "0.18.1"
toml-cfg = "0.2.0"
